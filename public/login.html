<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Palani Murugan Function Hall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-wrapper">
        <div class="brand-logo-emblem">PM</div>
        <div class="brand-title">
          Palani Murugan
          <small>பழனி முருகன் திருமண மஹால்</small>
        </div>
      </a>
      <a href="/" class="btn btn-outline btn-sm">Home (முகப்பு)</a>
    </div>
  </nav>

  <div class="container section" style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div class="booking-form-card" style="max-width: 480px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.8rem; color: var(--primary-maroon);">Sign In to Your Account</h2>
        <span class="tamil-sub">கணக்கில் உள்நுழையவும்</span>
      </div>

      <div id="login-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
          <input type="email" class="form-input" id="login-email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password <span class="required">*</span></label>
          <input type="password" class="form-input" id="login-password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="btn-login-submit">
          <span>Sign In</span>
          <span class="btn-ta">உள்நுழைய</span>
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Don't have an account? <a href="/register.html" style="color: var(--primary-maroon); font-weight: bold;">Register Here</a>
        </p>
      </div>

      <!-- Quick Demo Login Presets -->
      <div style="margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border-light);">
        <small style="color: var(--text-muted); display: block; margin-bottom: 10px; text-align: center; font-weight: bold;">
          ⚡ Quick Test Login Credentials:
        </small>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-sm btn-outline" onclick="fillCreds('owner@palanimurugan.com', 'Owner@Palani2026')">
            Hall Owner
          </button>
          <button type="button" class="btn btn-sm btn-outline" onclick="fillCreds('admin@palanimurugan.com', 'Admin@Palani2026')">
            Administrator
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer" style="padding: 20px 0; text-align: center;">
    <div class="container">
      <small style="color: #a39082;">&copy; 2026 Palani Murugan Function Hall</small>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    function fillCreds(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      App.toast(`Filled credentials for ${email}`, 'info');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('btn-login-submit');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      try {
        const res = await App.apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.ok && res.data.success) {
          App.setAuth(res.data.token, res.data.user);
          App.toast(`Welcome back, ${res.data.user.fullName}!`, 'success');

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          const id = urlParams.get('id');

          setTimeout(() => {
            if (redirect === 'booking') {
              window.location.href = id ? `/booking.html?id=${id}` : '/booking.html';
            } else if (res.data.user.role === 'admin') {
              window.location.href = '/admin-dashboard.html';
            } else if (res.data.user.role === 'owner') {
              window.location.href = '/owner-dashboard.html';
            } else {
              window.location.href = '/customer-dashboard.html';
            }
          }, 600);
        } else {
          document.getElementById('login-alert').innerHTML = `
            <div class="alert alert-error">${res.data.message || 'Invalid email or password.'}</div>
          `;
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span><span class="btn-ta">உள்நுழைய</span>';
        }
      } catch (err) {
        App.toast('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span><span class="btn-ta">உள்நுழைய</span>';
      }
    });
  </script>
</body>
</html>
