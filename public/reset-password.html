<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Sri Palani Murugan Function Hall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-wrapper">
        <div class="brand-logo-emblem">PM</div>
        <div class="brand-title">
          Sri Palani Murugan
          <small>ஸ்ரீ பழனி முருகன் திருமண மண்டபம்</small>
        </div>
      </a>
      <a href="/login.html" class="btn btn-outline btn-sm">Back to Login</a>
    </div>
  </nav>

  <div class="container section" style="flex:1; display:flex; align-items:center; justify-content:center; padding: 30px 16px;">
    <div class="booking-form-card" style="max-width: 480px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.8rem; color: var(--primary-maroon);">Create New Password</h2>
        <span class="tamil-sub">புதிய கடவுச்சொல்லை அமைக்கவும்</span>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">
          Set a new secure password for your Sri Palani Murugan Function Hall account.
        </p>
      </div>

      <div id="reset-alert"></div>

      <form id="reset-form">
        <input type="hidden" id="reset-token">

        <div class="form-group">
          <label class="form-label" for="reset-email">Account Email Address <span class="required">*</span></label>
          <input type="email" class="form-input" id="reset-email" required readonly style="background:#f8fafc; cursor:not-allowed;">
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-password">New Password <span class="required">*</span></label>
          <input type="password" class="form-input" id="reset-password" required placeholder="Minimum 6 characters" minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-password">Confirm New Password <span class="required">*</span></label>
          <input type="password" class="form-input" id="reset-confirm-password" required placeholder="Re-enter your new password" minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" id="btn-reset-submit">
          <span>Set New Password</span>
          <span class="btn-ta">கடவுச்சொல்லை மாற்று</span>
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Remembered your password? <a href="/login.html" style="color: var(--primary-maroon); font-weight: bold;">Sign In Here</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="footer" style="padding: 20px 0; text-align: center;">
    <div class="container">
      <small style="color: #a39082;">&copy; 2026 Sri Palani Murugan Function Hall</small>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const email = urlParams.get('email');

      if (!token || !email) {
        document.getElementById('reset-alert').innerHTML = `
          <div class="alert alert-error" style="background:#fee2e2; color:#991b1b; padding:12px; border-radius:6px; margin-bottom:16px;">
            ⚠️ Invalid or missing password reset link. Please request a new link from the login page.
          </div>
        `;
        document.getElementById('btn-reset-submit').disabled = true;
        return;
      }

      document.getElementById('reset-token').value = token;
      document.getElementById('reset-email').value = email;
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('reset-token').value;
      const email = document.getElementById('reset-email').value;
      const password = document.getElementById('reset-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;
      const submitBtn = document.getElementById('btn-reset-submit');
      const alertBox = document.getElementById('reset-alert');

      if (password !== confirmPassword) {
        alertBox.innerHTML = `
          <div class="alert alert-error" style="background:#fee2e2; color:#991b1b; padding:12px; border-radius:6px; margin-bottom:16px;">
            ⚠️ Passwords do not match.
          </div>
        `;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Updating Password...';
      alertBox.innerHTML = '';

      try {
        const res = await App.apiFetch('/api/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, email, password, confirmPassword })
        });

        if (res.ok && res.data.success) {
          alertBox.innerHTML = `
            <div class="alert alert-success" style="background:#dcfce7; color:#15803d; padding:12px; border-radius:6px; margin-bottom:16px;">
              ✅ ${res.data.message} Redirecting to login...
            </div>
          `;
          App.toast('Password reset successful!', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          alertBox.innerHTML = `
            <div class="alert alert-error" style="background:#fee2e2; color:#991b1b; padding:12px; border-radius:6px; margin-bottom:16px;">
              ⚠️ ${res.data.message || 'Unable to reset password.'}
            </div>
          `;
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Set New Password</span><span class="btn-ta">கடவுச்சொல்லை மாற்று</span>';
        }
      } catch (err) {
        alertBox.innerHTML = `
          <div class="alert alert-error" style="background:#fee2e2; color:#991b1b; padding:12px; border-radius:6px; margin-bottom:16px;">
            ⚠️ Network error. Please try again.
          </div>
        `;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Set New Password</span><span class="btn-ta">கடவுச்சொல்லை மாற்று</span>';
      }
    });
  </script>
</body>
</html>
